name: build-image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - name: baixar código
        uses: actions/checkout@v4

      - name: preparar docker builds
        uses: docker/setup-buildx-action@v3

      - name: entrar no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: construir e publicar imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/kv-aliaga/acta-import-api:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/kv-aliaga/acta-import-api
            org.opencontainers.image.revision=${{ github.sha }}
